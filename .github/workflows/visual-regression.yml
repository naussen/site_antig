name: Regressão visual

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: visual-regression-placeholder

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Comparar baselines visuais
        run: npm run test:visual

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-regressao-visual
          path: |
            playwright-report
            test-results/visual
          if-no-files-found: ignore
          retention-days: 7
